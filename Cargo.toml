[workspace]
resolver = "2"
members = [
    "crates/vfs-core",
    "crates/engine",
    "crates/index",
    "crates/stream",
    "crates/sfiles-ffi",
    "crates/sfiles-bindgen",
    "crates/sfiles-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
vfs-core = { path = "crates/vfs-core" }
sfiles-engine = { path = "crates/engine" }
sfiles-index = { path = "crates/index" }
sfiles-stream = { path = "crates/stream" }

uniffi = "0.32"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }

# Network backends (vfs-core feature gates: webdav / smb)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "charset"] }
quick-xml = "0.42"
percent-encoding = "2"
# NOTE: sspi's curve25519-dalek RC pin only exists for macOS/iOS targets, so
# smb 0.12 resolves fine on Linux/Android; it only collides with russh ^0.65
# (sftp) when both target Apple platforms.
smb = "0.12"
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
