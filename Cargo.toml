[workspace]
resolver = "2"
members = [
    "crates/vfs-core",
    "crates/engine",
    "crates/index",
    "crates/stream",
    "crates/localsend",
    "crates/sfiles-ffi",
    "crates/sfiles-bindgen",
    "crates/sfiles-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
vfs-core = { path = "crates/vfs-core" }
sfiles-engine = { path = "crates/engine" }
sfiles-index = { path = "crates/index" }
sfiles-stream = { path = "crates/stream" }
sfiles-localsend = { path = "crates/localsend" }

uniffi = "0.32"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }

# Network backends (vfs-core feature gates: webdav / smb / sftp)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "charset"] }
quick-xml = "0.42"
percent-encoding = "2"
# NOTE: sspi's curve25519-dalek RC pin only exists for macOS/iOS targets, so
# smb 0.12 resolves fine on Linux/Android; it only collides with russh ^0.65
# (sftp) when both target Apple platforms.
smb = "0.12"
futures-util = "0.3"
# russh is pinned to 0.55: its crypto stack (curve25519-dalek ^4,
# elliptic-curve ^0.13, pkcs5 ^0.7, rsa ^0.9, signature ^2) is a *different
# semver family* than the RustCrypto RC pins of smb's sspi
# (=curve25519-dalek-5.0.0-rc.1, =p256-0.14.0-rc.14, =rsa-0.10.0-rc.18, ...),
# so both resolve side by side in one lockfile. Every newer russh collides
# with sspi on versions the single-lockfile resolver cannot duplicate:
#   0.63-0.65  curve25519-dalek ^5            vs sspi =5.0.0-rc.1
#   0.62.3-7   curve25519-dalek ^5            (same)
#   0.62.0-2   p256 =0.14.0-rc.15             vs sspi =0.14.0-rc.14
#   0.61.x     curve25519-dalek =5.0.0-rc.0   vs =5.0.0-rc.1
#   0.60.2     aead =0.6.0-rc.10              vs smb aead ^0.6
#   0.60.0-1   resolves, but its code needs pre-rename pkcs5 0.8.0-rc.13 while
#              sspi's chain pulls pkcs5 ^0.8 finals (API rename between them)
#   0.57-0.59  rand_core =0.10.0-rc-3         vs sspi rand_core ^0.10
#   0.56       ssh-key 0.6.16 targets rsa ~0.10.0-rc.10 APIs; sspi pins
#              rsa =0.10.0-rc.18 whose rand_core 0.10 traits break its build
# russh 0.55 defaults to the aws-lc-rs crypto provider, which drags in
# aws-lc-sys (CMake + AArch64 asm) — the worst possible dependency for the
# aarch64-unknown-linux-ohos cross build. The `ring` provider covers the
# same algorithms and cross-compiles with plain cc + the NDK clang.
russh = { version = "0.55", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.1.2"

# Local one-line patch: smb-rs never sets TCP_NODELAY, so Nagle + delayed ACK
# cost ~40ms per SMB round trip (measured 19 MiB/s vs 103 MiB/s with
# smbclient). See vendor/smb-transport/src/tcp/transport.rs (LOCAL PATCH).
[patch.crates-io]
smb-transport = { path = "vendor/smb-transport" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
