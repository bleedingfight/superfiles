[workspace]
resolver = "2"
members = [
    "crates/vfs-core",
    "crates/engine",
    "crates/index",
    "crates/sfiles-ffi",
    "crates/sfiles-bindgen",
    "crates/sfiles-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
vfs-core = { path = "crates/vfs-core" }
sfiles-engine = { path = "crates/engine" }
sfiles-index = { path = "crates/index" }

uniffi = "0.32"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
