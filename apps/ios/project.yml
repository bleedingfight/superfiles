name: SuperFilesApp
options:
  bundleIdPrefix: com.superfiles
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  SuperFilesApp:
    type: application
    platform: iOS
    sources:
      - path: SuperFiles
      - path: Generated
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superfiles.app
        PRODUCT_NAME: Super Files
        INFOPLIST_FILE: SuperFiles/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Frameworks
    dependencies:
      # Built by scripts/build-ios.sh (static lib + headers -> xcframework).
      - framework: Frameworks/SuperFilesCore.xcframework
        embed: false
        link: true
