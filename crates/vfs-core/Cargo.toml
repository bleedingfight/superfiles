[package]
name = "vfs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Portable virtual filesystem abstractions for Super Files"

# NOTE: see the russh comment in the workspace Cargo.toml for why sftp is
# pinned to russh 0.55 (smb's sspi owns the RustCrypto RC ecosystem).
[features]
default = ["webdav", "smb", "sftp"]
webdav = ["dep:reqwest", "dep:quick-xml", "dep:percent-encoding"]
smb = ["dep:smb", "dep:futures-util"]
sftp = ["dep:russh", "dep:russh-sftp"]

[dependencies]
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
reqwest = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
smb = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }

[dev-dependencies]
tiny_http = "0.12"
env_logger = "0.11"
